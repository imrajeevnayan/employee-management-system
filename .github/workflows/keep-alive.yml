name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render health endpoint
        run: |
          echo "Pinging Render..."

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 \
            https://employee-management-system-22by.onrender.com/actuator/health)

          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Render is alive."
          else
            echo "Render returned HTTP $HTTP_STATUS"
            exit 1
          fi
