name: Keep Render Alive

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Render
        run: |
          URL="https://employee-management-system-22by.onrender.com/actuator/health"

          echo "Pinging $URL"

          HTTP_STATUS=$(curl \
            --location \
            --silent \
            --show-error \
            --output /tmp/response.txt \
            --write-out "%{http_code}" \
            --connect-timeout 30 \
            --max-time 180 \
            --retry 2 \
            --retry-delay 10 \
            "$URL") || true

          echo "HTTP status: $HTTP_STATUS"
          echo "Response:"
          cat /tmp/response.txt || true

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Render responded with HTTP 200"
          else
            echo "❌ Render did not respond successfully"
            exit 1
          fi
