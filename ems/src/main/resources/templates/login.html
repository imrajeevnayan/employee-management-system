<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · EMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/ems.css}">
</head>
<body class="login-page">
<div class="card login-card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="login-logo mx-auto mb-2"><i class="bi bi-people-fill"></i></div>
            <h1 class="h4 fw-bold mb-1">EMS</h1>
            <p class="text-muted small mb-0">Employee Management System — sign in to continue</p>
        </div>

        <div class="alert alert-danger py-2 small mb-3" role="alert" th:if="${param.error}">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>
            Invalid username or password, or the account is disabled.
        </div>
        <div class="alert alert-success py-2 small mb-3" role="alert" th:if="${param.logout}">
            <i class="bi bi-check-circle-fill me-1"></i>
            You have been signed out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                       autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
            </button>
        </form>
    </div>
</div>
</body>
</html>
