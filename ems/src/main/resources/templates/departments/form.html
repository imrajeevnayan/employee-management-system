<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Department form')}"></head>
<body class="app">
<aside th:replace="~{fragments/layout :: sidenav('departments')}"></aside>
<div class="app-wrapper">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>

    <main class="container-fluid px-4 py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <h1 class="h3 mb-0" th:text="${form.id == null} ? 'Add department' : 'Edit department'">Department</h1>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/departments}">
                <i class="bi bi-arrow-left me-1"></i>Back to list
            </a>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <form th:object="${form}" method="post" novalidate class="needs-fix"
              th:action="${form.id == null} ? @{/departments} : @{/departments/{id}(id=${form.id})}">
            <div class="card shadow-sm" style="max-width: 720px;">
                <div class="card-body p-4">
                    <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
                        <span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</span>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label" for="name">Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" autofocus>
                            <div class="invalid-feedback" th:errors="*{name}">Error</div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="code">Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control text-uppercase" id="code" th:field="*{code}"
                                   placeholder="e.g. ENG" maxlength="10"
                                   th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{code}">Error</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="location">Location</label>
                            <input type="text" class="form-control" id="location" th:field="*{location}"
                                   th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{location}">Error</div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="description">Description</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}">Error</div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white d-flex justify-content-end gap-2 p-3">
                    <a class="btn btn-outline-secondary" th:href="@{/departments}">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Save department
                    </button>
                </div>
            </div>
        </form>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
