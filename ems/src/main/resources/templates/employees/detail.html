<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Employee details')}"></head>
<body class="app">
<aside th:replace="~{fragments/layout :: sidenav('employees')}"></aside>
<div class="app-wrapper">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>

    <main class="container-fluid px-4 py-4" th:with="employee=${employee}">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <div class="d-flex align-items-center gap-3">
                <div class="avatar-circle" th:text="${#strings.substring(employee.firstName,0,1) + #strings.substring(employee.lastName,0,1)}">AM</div>
                <div>
                    <h1 class="h3 mb-0" th:text="${employee.fullName}">Full Name</h1>
                    <p class="text-muted mb-0">
                        <span th:text="${employee.employeeCode}">EMP-0000</span> ·
                        <span th:text="${employee.jobTitle}">Engineer</span>
                    </p>
                </div>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/employees}">
                    <i class="bi bi-arrow-left me-1"></i>Back to list
                </a>
                <a sec:authorize="hasAnyRole('ADMIN','HR','MANAGER')"
                   th:if="${canManageAll or (managerDepartmentId != null and employee.department.id == managerDepartmentId)}"
                   class="btn btn-primary btn-sm" th:href="@{'/employees/' + ${employee.id} + '/edit'}">
                    <i class="bi bi-pencil me-1"></i>Edit
                </a>
                <form sec:authorize="hasRole('ADMIN')" class="d-inline"
                      th:action="@{'/employees/' + ${employee.id} + '/delete'}" method="post"
                      onsubmit="return confirm('Delete this employee record? This cannot be undone.');">
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-trash me-1"></i>Delete
                    </button>
                </form>
            </div>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="row g-3">
            <div class="col-lg-7">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-semibold"><i class="bi bi-person me-1"></i>Personal &amp; contact</div>
                    <div class="card-body">
                        <dl class="row mb-0">
                            <dt class="col-sm-4">First name</dt>
                            <dd class="col-sm-8" th:text="${employee.firstName}">First</dd>
                            <dt class="col-sm-4">Last name</dt>
                            <dd class="col-sm-8" th:text="${employee.lastName}">Last</dd>
                            <dt class="col-sm-4">Email</dt>
                            <dd class="col-sm-8">
                                <a th:href="'mailto:' + ${employee.email}" th:text="${employee.email}">email</a>
                            </dd>
                            <dt class="col-sm-4">Phone</dt>
                            <dd class="col-sm-8" th:text="${employee.phone ?: '—'}">—</dd>
                        </dl>
                    </div>
                </div>
            </div>
            <div class="col-lg-5">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-semibold"><i class="bi bi-briefcase me-1"></i>Employment</div>
                    <div class="card-body">
                        <dl class="row mb-0">
                            <dt class="col-sm-5">Department</dt>
                            <dd class="col-sm-7">
                                <a class="text-decoration-none" th:href="@{'/departments/' + ${employee.department.id}}"
                                   th:text="${employee.department.name}">Engineering</a>
                            </dd>
                            <dt class="col-sm-5">Job title</dt>
                            <dd class="col-sm-7" th:text="${employee.jobTitle}">Engineer</dd>
                            <dt class="col-sm-5">Salary</dt>
                            <dd class="col-sm-7" th:text="${#numbers.formatDecimal(employee.salary, 1, 'COMMA', 2, 'POINT')}">0.00</dd>
                            <dt class="col-sm-5">Hire date</dt>
                            <dd class="col-sm-7" th:text="${#temporals.format(employee.hireDate, 'dd MMM yyyy')}">01 Jan 2026</dd>
                            <dt class="col-sm-5">Status</dt>
                            <dd class="col-sm-7">
                                <span class="badge"
                                      th:classappend="${employee.status.name() == 'ACTIVE'} ? 'bg-success' : (${employee.status.name() == 'ON_LEAVE'} ? 'bg-warning text-dark' : 'bg-danger')"
                                      th:text="${employee.status.label}">Active</span>
                            </dd>
                            <dt class="col-sm-5">Login account</dt>
                            <dd class="col-sm-7" th:text="${employee.user != null} ? ${employee.user.username} : 'Not linked'">
                                Not linked
                            </dd>
                        </dl>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-semibold"><i class="bi bi-clock-history me-1"></i>Audit trail</div>
                    <div class="card-body">
                        <dl class="row mb-0 small">
                            <dt class="col-sm-3">Created</dt>
                            <dd class="col-sm-9"
                                th:text="${employee.createdBy} + ' · ' + ${#temporals.format(employee.createdAt, 'dd MMM yyyy HH:mm')}">
                                system
                            </dd>
                            <dt class="col-sm-3">Last updated</dt>
                            <dd class="col-sm-9"
                                th:text="${employee.updatedAt != null} ? ${employee.lastModifiedBy} + ' · ' + ${#temporals.format(employee.updatedAt, 'dd MMM yyyy HH:mm')} : '—'">
                                —
                            </dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
