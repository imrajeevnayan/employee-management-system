<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request problem · EMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/ems.css}">
</head>
<body class="login-page">
<div class="card login-card shadow-lg border-0 text-center">
    <div class="card-body p-5">
        <div class="display-1 fw-bold text-warning">Oops</div>
        <h1 class="h5 mb-2"><i class="bi bi-exclamation-triangle me-1"></i>Request could not be completed</h1>
        <p class="text-muted" th:text="${message} ?: 'The request conflicts with the current state of the data.'">
            The request conflicts with the current state of the data.
        </p>
        <a class="btn btn-primary me-2" th:href="@{/dashboard}">Back to dashboard</a>
        <a class="btn btn-outline-secondary" th:href="@{/login}">Sign in</a>
    </div>
</div>
</body>
</html>
