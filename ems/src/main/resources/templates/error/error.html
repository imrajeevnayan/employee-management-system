<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error · EMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/ems.css}">
</head>
<body class="login-page">
<div class="card login-card shadow-lg border-0 text-center">
    <div class="card-body p-5">
        <div class="display-1 fw-bold text-danger" th:text="${status} ?: 'Error'">Error</div>
        <p class="text-muted" th:text="${message} ?: 'An unexpected error occurred.'">
            An unexpected error occurred.
        </p>
        <a class="btn btn-primary me-2" th:href="@{/dashboard}">Back to dashboard</a>
        <a class="btn btn-outline-secondary" th:href="@{/login}">Sign in</a>
    </div>
</div>
</body>
</html>
