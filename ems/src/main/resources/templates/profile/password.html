<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change password')}"></head>
<body class="app">
<aside th:replace="~{fragments/layout :: sidenav('profile')}"></aside>
<div class="app-wrapper">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>

    <main class="container-fluid px-4 py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <h1 class="h3 mb-0">Change password</h1>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/profile}">
                <i class="bi bi-arrow-left me-1"></i>Back to profile
            </a>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <form th:object="${form}" th:action="@{/profile/password}" method="post" novalidate>
            <div class="card shadow-sm" style="max-width: 520px;">
                <div class="card-body p-4">
                    <div class="mb-3">
                        <label class="form-label" for="currentPassword">Current password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="currentPassword" th:field="*{currentPassword}"
                               autocomplete="current-password"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{currentPassword}">Error</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="newPassword">New password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}"
                               autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{newPassword}">Error</div>
                        <div class="form-text">Min. 8 characters with upper case, lower case, a digit and a special character.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirmPassword">Confirm new password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                               autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{confirmPassword}">Error</div>
                    </div>
                </div>
                <div class="card-footer bg-white d-flex justify-content-end gap-2 p-3">
                    <a class="btn btn-outline-secondary" th:href="@{/profile}">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Update password
                    </button>
                </div>
            </div>
        </form>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
