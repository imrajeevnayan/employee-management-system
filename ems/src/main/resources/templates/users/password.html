<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset password')}"></head>
<body class="app">
<aside th:replace="~{fragments/layout :: sidenav('users')}"></aside>
<div class="app-wrapper">
    <nav th:replace="~{fragments/layout :: topbar}"></nav>

    <main class="container-fluid px-4 py-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
            <div>
                <h1 class="h3 mb-1">Reset password</h1>
                <p class="text-muted mb-0">
                    Setting a new password for
                    <span class="fw-semibold" th:text="${user.username}">user</span>
                </p>
            </div>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/users}">
                <i class="bi bi-arrow-left me-1"></i>Back to list
            </a>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <form th:object="${form}" th:action="@{'/users/' + ${user.id} + '/password'}" method="post" novalidate>
            <div class="card shadow-sm" style="max-width: 520px;">
                <div class="card-body p-4">
                    <div class="mb-3">
                        <label class="form-label" for="password">New password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" th:field="*{password}"
                               autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{password}">Error</div>
                        <div class="form-text">Min. 8 characters with upper case, lower case, a digit and a special character.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirmPassword">Confirm password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                               autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{confirmPassword}">Error</div>
                    </div>
                </div>
                <div class="card-footer bg-white d-flex justify-content-end gap-2 p-3">
                    <a class="btn btn-outline-secondary" th:href="@{/users}">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-key me-1"></i>Reset password
                    </button>
                </div>
            </div>
        </form>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
